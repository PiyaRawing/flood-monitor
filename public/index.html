<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ระบบตรวจวัดระดับน้ำและเครือข่ายเซนเซอร์</title>

  <!-- Google Fonts: Noto Sans Thai -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['"Noto Sans Thai"', 'sans-serif'] },
          colors: { brand: { 50: '#fff7ed', 100: '#ffedd5', 500: '#f97316', 600: '#ea580c', 700: '#c2410c' } }
        }
      }
    }
  </script>

  <style>
    body { font-family: 'Noto Sans Thai', sans-serif; }
    .custom-scroll::-webkit-scrollbar { width: 6px; }
    .custom-scroll::-webkit-scrollbar-track { background: #f1f5f9; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    
    .leaflet-popup-content-wrapper {
      padding: 0;
      border-radius: 1rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.15), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
      overflow: hidden;
    }
    .leaflet-popup-content {
      margin: 12px;
      line-height: 1.4;
      width: 210px !important;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased flex flex-col min-h-screen md:h-screen md:overflow-hidden">

  <!-- ================= 1. HEADER ================= -->
  <header class="bg-white border-b border-slate-200/80 px-4 md:px-6 py-3 shrink-0 flex items-center justify-between shadow-sm z-30">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 md:w-11 md:h-11 rounded-xl bg-gradient-to-tr from-brand-600 to-amber-500 flex items-center justify-center text-white shadow-md shrink-0">
        <i data-lucide="waves" class="w-5 h-5 md:w-6 md:h-6"></i>
      </div>
      <div>
        <h1 class="text-base md:text-xl font-bold text-slate-900 tracking-tight leading-tight">ระบบตรวจวัดระดับน้ำและเครือข่ายเซนเซอร์</h1>
        <p class="text-xs md:text-sm text-slate-500 flex items-center gap-1.5 mt-0.5 font-medium">
          <span class="inline-block w-2.5 h-2.5 rounded-full bg-emerald-500"></span>
          เชื่อมต่อโครงข่าย Gateway LoRa
        </p>
      </div>
    </div>

    <div class="flex items-center gap-3">
      <div class="text-right hidden sm:block">
        <div class="text-[11px] text-slate-400 font-medium">อัปเดตข้อมูลล่าสุด</div>
        <div id="liveClock" class="text-xs md:text-sm font-semibold text-slate-700">กำลังเชื่อมต่อ...</div>
      </div>
      <div class="flex items-center gap-1.5 bg-emerald-50 border border-emerald-200/80 px-3 py-1.5 rounded-xl text-emerald-700 text-xs md:text-sm font-bold">
        <span class="relative flex h-2 w-2">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
          <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
        </span>
        Online
      </div>
    </div>
  </header>

  <!-- ================= 2. MAIN WORKSPACE ================= -->
  <main class="flex-1 flex flex-col md:flex-row overflow-y-auto md:overflow-hidden relative pb-16 md:pb-16">

    <!-- กรอบแผนที่ (คุมความสูงบนมือถือ/iPad และ desktop ชัดเจน) -->
    <div class="relative w-full h-[52vh] md:h-full md:w-[65%] bg-slate-100 shrink-0 overflow-hidden">
      <div id="map" class="w-full h-full z-0"></div>
    </div>

    <!-- ส่วนรายการข้อมูลด้านขวา -->
    <aside class="w-full md:w-[35%] md:h-full bg-white border-t md:border-t-0 md:border-l border-slate-200/80 flex flex-col z-20 shadow-[-4px_0_12px_rgba(0,0,0,0.02)]">
      
      <!-- สรุปตัวเลข 3 สถานะ (แก้การ์ดยุบ / ตัวอักษรตกบรรทัด) -->
      <div class="p-3.5 border-b border-slate-100 bg-slate-50/60 shrink-0">
        <h2 class="text-xs font-bold text-slate-500 tracking-wider uppercase mb-2">สรุปภาพรวมสถานการณ์น้ำ</h2>
        <div class="grid grid-cols-3 gap-2">
          <!-- วิกฤต -->
          <div class="bg-rose-50 border border-rose-200/80 rounded-xl py-2 px-1 text-center flex flex-col justify-center items-center">
            <span id="countCritical" class="text-xl md:text-2xl font-black text-rose-600 leading-none">0</span>
            <span class="text-[11px] md:text-xs font-bold text-rose-700 mt-1">วิกฤต</span>
          </div>
          <!-- เตือนภัย -->
          <div class="bg-amber-50 border border-amber-200/80 rounded-xl py-2 px-1 text-center flex flex-col justify-center items-center">
            <span id="countWarning" class="text-xl md:text-2xl font-black text-amber-600 leading-none">0</span>
            <span class="text-[11px] md:text-xs font-bold text-amber-700 mt-1">เตือนภัย</span>
          </div>
          <!-- ปกติ -->
          <div class="bg-emerald-50 border border-emerald-200/80 rounded-xl py-2 px-1 text-center flex flex-col justify-center items-center">
            <span id="countNormal" class="text-xl md:text-2xl font-black text-emerald-600 leading-none">0</span>
            <span class="text-[11px] md:text-xs font-bold text-emerald-700 mt-1">ปกติ</span>
          </div>
        </div>
      </div>

      <!-- หัวข้อ Sensor List -->
      <div class="px-4 py-2.5 bg-white border-b border-slate-100 flex items-center justify-between shrink-0">
        <div class="flex items-center gap-2 text-xs md:text-sm font-bold text-slate-800">
          <i data-lucide="radio" class="w-4 h-4 text-brand-600"></i>
          <span>รายการจุดตรวจวัด</span>
          <span id="stationCountBadge" class="bg-slate-100 text-slate-700 text-xs font-bold px-2 py-0.5 rounded-full">0</span>
        </div>
        <span class="text-[11px] text-slate-400 font-medium">คลิกเพื่อดูหมุดบนแผนที่</span>
      </div>

      <!-- รายการเซนเซอร์ (Scrollable) -->
      <div id="sensorListContainer" class="flex-1 overflow-y-auto custom-scroll p-3 space-y-2.5 bg-slate-50/40">
        <div class="py-16 text-center text-slate-400 text-sm">
          <i data-lucide="loader" class="w-7 h-7 mx-auto mb-2 animate-spin text-slate-300"></i>
          กำลังโหลดข้อมูล...
        </div>
      </div>
    </aside>

  </main>

  <!-- ================= 3. NAVIGATION ล่างสุด (z-[1050]) ================= -->
  <nav class="fixed bottom-0 left-0 right-0 h-16 bg-white/95 backdrop-blur-md border-t border-slate-200/90 px-4 flex items-center justify-around z-[1050] shadow-[0_-4px_16px_rgba(0,0,0,0.06)]">
    <a href="/index.html" class="flex items-center gap-2 py-2 px-5 rounded-full bg-brand-50 text-brand-600 border border-brand-200/80 font-bold text-xs md:text-sm transition shadow-sm">
      <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
      <span>ภาพรวมระบบ</span>
    </a>
    <a href="/history.html" class="flex items-center gap-2 py-2 px-5 rounded-full text-slate-600 hover:text-slate-900 hover:bg-slate-100 font-semibold text-xs md:text-sm transition">
      <i data-lucide="line-chart" class="w-4 h-4"></i>
      <span>ข้อมูลย้อนหลัง</span>
    </a>
    <a href="/admin.html" class="flex items-center gap-2 py-2 px-5 rounded-full text-slate-600 hover:text-slate-900 hover:bg-slate-100 font-semibold text-xs md:text-sm transition">
      <i data-lucide="settings" class="w-4 h-4"></i>
      <span>หน้าแอดมิน (ตั้งค่า)</span>
    </a>
  </nav>

  <!-- ================= JAVASCRIPT LOGIC ================= -->
  <script>
    let stations = [];
    let map;
    const markersMap = new Map();

    function getStatusConfig(statusKey) {
      if (statusKey === 'critical') {
        return {
          key: 'critical',
          label: 'วิกฤต',
          hex: '#f43f5e',
          badgeClass: 'bg-rose-50 text-rose-700 border-rose-200',
          dotClass: 'bg-rose-500',
          borderHover: 'hover:border-rose-300'
        };
      }
      if (statusKey === 'warning') {
        return {
          key: 'warning',
          label: 'เตือนภัย',
          hex: '#f59e0b',
          badgeClass: 'bg-amber-50 text-amber-700 border-amber-200',
          dotClass: 'bg-amber-500',
          borderHover: 'hover:border-amber-300'
        };
      }
      return {
        key: 'normal',
        label: 'ปกติ',
        hex: '#10b981',
        badgeClass: 'bg-emerald-50 text-emerald-700 border-emerald-200',
        dotClass: 'bg-emerald-500',
        borderHover: 'hover:border-emerald-300'
      };
    }

    // ฟังก์ชันคำนวณสถานะ: ป้องกันข้อผิดพลาดเกณฑ์ตัวเลข
    function determineStatus(item) {
      const depth = Number(item.waterDepthCm) || 0;

      let warnVal = parseFloat(item.warningThreshold);
      let critVal = parseFloat(item.criticalThreshold);

      // ถ้าไม่มีค่า หรือค่าผิดปกติ ให้ใช้เกณฑ์มาตรฐาน: เตือนภัย 25 cm, วิกฤต 50 cm
      if (isNaN(warnVal) || warnVal <= 0) warnVal = 25;
      if (isNaN(critVal) || critVal <= 0) critVal = 50;

      if (depth >= critVal) return 'critical';
      if (depth >= warnVal) return 'warning';
      return 'normal';
    }

    function initMap() {
      map = L.map('map', { zoomControl: false }).setView([13.606, 100.702], 12);
      L.control.zoom({ position: 'topright' }).addTo(map);

      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(map);

      // ยก margin-bottom เป็น 76px เพื่อพ้นแถบ Bottom Nav บน iPad แน่นอน
      const legendControl = L.control({ position: 'bottomleft' });
      legendControl.onAdd = function () {
        const div = L.DomUtil.create('div', '');
        div.style.backgroundColor = 'rgba(255, 255, 255, 0.95)';
        div.style.backdropFilter = 'blur(6px)';
        div.style.webkitBackdropFilter = 'blur(6px)';
        div.style.padding = '6px 12px';
        div.style.borderRadius = '12px';
        div.style.border = '1px solid #cbd5e1';
        div.style.boxShadow = '0 4px 10px rgba(0, 0, 0, 0.12)';
        div.style.marginBottom = '90px'; // ยกหนี Bottom Nav ไม่ให้โดนทับเด็ดขาด
        div.style.marginLeft = '24px';
        div.style.pointerEvents = 'none';
        div.style.zIndex = '900';
        div.style.whiteSpace = 'nowrap';
        div.style.flexShrink = '0';

        div.innerHTML = `
          <div style="display: flex; align-items: center; gap: 10px; font-size: 11px; font-weight: 700; font-family: 'Noto Sans Thai', sans-serif; color: #334155;">
            <div style="display: flex; align-items: center; gap: 4px;">
              <span style="width: 9px; height: 9px; border-radius: 50%; background-color: #f43f5e; display: inline-block;"></span>
              <span>วิกฤต</span>
            </div>
            <div style="display: flex; align-items: center; gap: 4px;">
              <span style="width: 9px; height: 9px; border-radius: 50%; background-color: #f59e0b; display: inline-block;"></span>
              <span>เตือนภัย</span>
            </div>
            <div style="display: flex; align-items: center; gap: 4px;">
              <span style="width: 9px; height: 9px; border-radius: 50%; background-color: #10b981; display: inline-block;"></span>
              <span>ปกติ</span>
            </div>
          </div>
        `;
        return div;
      };
      legendControl.addTo(map);
    }

    function createCustomMarkerIcon(statusHex, depthCm) {
      return L.divIcon({
        className: 'custom-leaflet-marker',
        html: `
          <div class="relative flex items-center justify-center">
            <span class="absolute w-10 h-10 rounded-full" style="background-color: ${statusHex}; opacity: 0.25;"></span>
            <div class="min-w-[34px] h-[34px] px-1 rounded-full border-2 border-white shadow-md flex items-center justify-center text-xs font-bold text-white" style="background-color: ${statusHex};">
              ${Math.round(depthCm)}
            </div>
          </div>
        `,
        iconSize: [36, 36],
        iconAnchor: [18, 18],
        popupAnchor: [0, -18]
      });
    }

    function renderMarkers(dataList) {
      markersMap.forEach(marker => map.removeLayer(marker));
      markersMap.clear();

      const validLatLngs = [];

      dataList.forEach(st => {
        if (st.lat === null || st.lng === null || isNaN(st.lat) || isNaN(st.lng)) return;

        validLatLngs.push([st.lat, st.lng]);
        const statusKey = determineStatus(st);
        const cfg = getStatusConfig(statusKey);
        const icon = createCustomMarkerIcon(cfg.hex, st.waterDepthCm);
        const marker = L.marker([st.lat, st.lng], { icon }).addTo(map);

        const popupContent = `
          <div class="font-sans text-slate-800" style="width: 210px;">
            <div class="flex items-center justify-between border-b border-slate-100 pb-1.5 mb-2">
              <span class="text-[10px] font-bold px-1.5 py-0.5 rounded ${cfg.badgeClass} border">${st.type}</span>
              <span class="text-[10px] text-slate-400 font-mono font-bold">${st.id}</span>
            </div>
            
            <h4 class="font-bold text-sm text-slate-900 leading-tight mb-2 truncate">${st.name}</h4>
            
            <div class="bg-slate-50 p-2.5 rounded-xl space-y-1.5 mb-2.5 border border-slate-100 text-xs">
              <div class="flex justify-between items-center">
                <span class="text-slate-500 text-[11px]">สถานะ:</span>
                <span class="font-bold text-[10px] px-2 py-0.5 rounded border ${cfg.badgeClass}">${cfg.label}</span>
              </div>
              <div class="flex justify-between items-center">
                <span class="text-slate-500 text-[11px]">ระดับน้ำ:</span>
                <span class="font-extrabold text-base" style="color: ${cfg.hex};">${st.waterDepthCm} cm</span>
              </div>
            </div>

            <a href="/history.html?device=${st.id}" class="w-full flex items-center justify-center gap-1.5 py-2 px-3 bg-brand-50 hover:bg-brand-100 text-brand-600 border border-brand-200/80 rounded-xl text-xs font-bold transition shadow-xs mb-2">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
              <span>ดูข้อมูลย้อนหลัง & กราฟ</span>
            </a>

            <div class="text-[10px] text-slate-400 flex justify-between font-medium pt-1 border-t border-slate-100">
              <span>${st.rssi !== null ? `${st.rssi} dBm` : '-'}</span>
              <span>${st.updatedAt}</span>
            </div>
          </div>
        `;

        const popup = L.popup({
          closeButton: false,
          autoPan: true,
          autoPanPadding: [20, 20],
          offset: [0, -10],
          minWidth: 210,
          maxWidth: 210
        }).setContent(popupContent);

        marker.bindPopup(popup);
        marker.on('popupopen', (e) => {
          e.popup.update();
        });

        markersMap.set(st.id, marker);
      });

      if (validLatLngs.length === 1) {
        map.setView(validLatLngs[0], 15);
      } else if (validLatLngs.length > 1) {
        map.fitBounds(validLatLngs, { padding: [40, 40] });
      }
    }

    function updateMetrics(dataList) {
      let crit = 0, warn = 0, norm = 0;
      dataList.forEach(s => {
        const key = determineStatus(s);
        if (key === 'critical') crit++;
        else if (key === 'warning') warn++;
        else norm++;
      });

      document.getElementById('countCritical').innerText = crit;
      document.getElementById('countWarning').innerText = warn;
      document.getElementById('countNormal').innerText = norm;
      document.getElementById('stationCountBadge').innerText = dataList.length;
    }

    function renderSensorList(dataList) {
      const container = document.getElementById('sensorListContainer');
      if (dataList.length === 0) {
        container.innerHTML = `
          <div class="py-16 text-center text-slate-400 text-sm">
            <i data-lucide="inbox" class="w-8 h-8 mx-auto mb-2 text-slate-300"></i>
            ยังไม่มีข้อมูลจุดตรวจวัดในระบบ
          </div>
        `;
        lucide.createIcons();
        return;
      }

      container.innerHTML = dataList.map(st => {
        const statusKey = determineStatus(st);
        const cfg = getStatusConfig(statusKey);

        return `
          <div 
            onclick="focusStation('${st.id}')"
            class="bg-white rounded-xl p-3 border border-slate-200/80 hover:shadow-md ${cfg.borderHover} cursor-pointer transition duration-150 group"
          >
            <div class="flex items-start justify-between gap-2">
              <div class="flex items-center gap-2 min-w-0">
                <span class="w-3 h-3 rounded-full ${cfg.dotClass} shrink-0"></span>
                <span class="text-sm font-bold text-slate-900 group-hover:text-brand-600 transition-colors truncate">${st.name}</span>
              </div>
              <span class="text-xs font-bold px-2 py-0.5 rounded-full border ${cfg.badgeClass} shrink-0">
                ${cfg.label}
              </span>
            </div>

            <div class="flex items-end justify-between mt-2 pt-2 border-t border-slate-100">
              <div class="text-xs text-slate-500 font-medium">
                <span class="inline-block px-2 py-0.5 bg-slate-100 rounded text-slate-700 font-bold">${st.type}</span>
              </div>
              <div class="text-right">
                <span class="text-base font-extrabold" style="color: ${cfg.hex};">${st.waterDepthCm} <span class="text-xs font-bold">cm</span></span>
              </div>
            </div>

            <div class="flex items-center justify-between mt-2 pt-2 border-t border-slate-100">
              <a 
                href="/history.html?device=${st.id}" 
                onclick="event.stopPropagation();"
                class="inline-flex items-center gap-1.5 py-1 px-2.5 rounded-lg bg-orange-50 hover:bg-orange-100 text-brand-600 border border-brand-200/80 text-xs font-bold transition"
              >
                <i data-lucide="line-chart" class="w-3.5 h-3.5"></i>
                <span>ดูประวัติ & กราฟ</span>
              </a>

              <span class="text-[11px] text-slate-400 font-medium">
                ${st.updatedAt}
              </span>
            </div>
          </div>
        `;
      }).join('');

      lucide.createIcons();
    }

    window.focusStation = function(stationId) {
      const marker = markersMap.get(stationId);
      const target = stations.find(s => s.id === stationId);
      if (marker && target && target.lat !== null && target.lng !== null) {
        if (window.innerWidth < 1024) {
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
        map.setView([target.lat, target.lng], 15);
        marker.openPopup();
      }
    };

    async function syncRealData() {
      try {
        const res = await fetch('/api/devices');
        if (!res.ok) return;
        const apiDevices = await res.json();

        if (Array.isArray(apiDevices)) {
          stations = apiDevices.map(dev => {
            const t = dev.latest_telemetry;
            const depth = (t && t.water_depth_cm !== null && t.water_depth_cm !== undefined) ? Number(t.water_depth_cm) : 0;
            const rawDist = (t && t.distance_cm !== undefined) ? Number(t.distance_cm) : null;

            return {
              id: dev.device_id,
              name: dev.device_name || `จุดวัด ${dev.device_id}`,
              type: dev.location_type || 'ถนน',
              lat: (dev.latitude !== null && dev.latitude !== undefined) ? parseFloat(dev.latitude) : null,
              lng: (dev.longitude !== null && dev.longitude !== undefined) ? parseFloat(dev.longitude) : null,
              waterDepthCm: depth,
              distanceCm: rawDist,
              tankHeightCm: dev.tank_height_cm || 83,
              warningThreshold: dev.warning_threshold_cm,
              criticalThreshold: dev.critical_threshold_cm,
              imageUrl: dev.image_url || '',
              updatedAt: t ? new Date(t.created_at).toLocaleTimeString('th-TH') : 'ยังไม่มีข้อมูล',
              battery: t ? t.battery_percent : null,
              rssi: t && t.signal ? t.signal.rssi : null
            };
          });

          renderMarkers(stations);
          renderSensorList(stations);
          updateMetrics(stations);
        }
      } catch (err) {
        console.error('Error fetching real data:', err);
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      initMap();

      const clockEl = document.getElementById('liveClock');
      function tick() {
        const now = new Date();
        clockEl.innerText = now.toLocaleDateString('th-TH', { 
          day: 'numeric', month: 'short', year: 'numeric', 
          hour: '2-digit', minute: '2-digit', second: '2-digit' 
        });
      }
      tick();
      setInterval(tick, 1000);

      syncRealData();
      setInterval(syncRealData, 5000);
    });
  </script>
</body>
</html>
